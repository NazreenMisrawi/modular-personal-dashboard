<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Personal Dashboard</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Dashboard</h2>
        <button id="sidebar-toggle" class="icon-btn mobile-only">☰</button>
      </div>
      <nav id="nav">
        <a href="javascript:void(0)" data-view="home" class="nav-item active">🏠 Home / Overview</a>
        <a href="javascript:void(0)" data-view="dashboards" class="nav-item">📊 My Dashboards</a>
        <a href="javascript:void(0)" data-view="calendar" class="nav-item">📅 Global Calendar</a>
        <a href="javascript:void(0)" data-view="activities" class="nav-item">✅ All Activities</a>
        <a href="javascript:void(0)" data-view="settings" class="nav-item">⚙️ Settings</a>
        <a href="javascript:void(0)" id="create-dashboard-btn" class="nav-item create">+ Create Dashboard</a>
        <div id="user-profile" class="nav-item" style="margin-top:1rem; cursor:pointer;" onclick="showProfileMenu()">
          <span id="user-icon">👤</span> <span id="user-email">Account</span>
        </div>
        <a href="javascript:void(0)" class="nav-item" onclick="saveAll()">💾 Save</a>
        <a href="javascript:void(0)" class="nav-item" onclick="logout()">Log out</a>
      </nav>
    </aside>
    <main id="main-content">
      <!-- Views rendered here -->
    </main>
  </div>
  <button id="mobile-menu-btn" class="mobile-menu-btn mobile-only">☰</button>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="icon-btn">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
